services:
  calculator:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-server-calculator:latest
    container_name: mcp-server-calculator
    # This is a stdio MCP server (FastMCP's default transport) — it speaks
    # JSON-RPC over stdin/stdout, not HTTP, so there are no ports to publish.
    # stdin_open + tty:false keeps stdio clean for JSON-RPC framing.
    stdin_open: true
    tty: false
    restart: "no"
